<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Equipamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4 mb-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            Cadastro de Equipamentos
        </div>

        <div class="card-body">

            <form method="POST" action="/salvar">

                <!-- DADOS GERAIS -->
                <h5 class="mb-3">Dados Gerais</h5>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label>Cliente</label>
                        <select name="cliente" class="form-control" required>
                            <option value="">Selecione o Cliente</option>
                            <option>Agripar</option>
                            <option>Agroceres</option>
                            <option>Bem da Terra</option>
                            <option>Coopadap</option>
                            <option>G1</option>
                            <option>Harpa</option>
                            <option>JC Rações</option>
                            <option>Lactowal</option>
                            <option>Lallemand</option>
                            <option>Seleto</option>
                            <option>Shancap</option>
                            <option>SPRPM</option>
                            <option>São Francisco</option>
                            <option>Stabile</option>
                            <option>Suico</option>
                            <option>Terra Prima</option>
                            <option>Veloso</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label>Local</label>
                        <input type="text" name="local" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label>Setor</label>
                        <input type="text" name="setor" class="form-control" required>
                    </div>
                </div>

                <hr>

                <!-- ================= CONCENTRADORES ================= -->
                <div class="mb-3">
                    <label>Quantidade de Concentradores</label>
                    <input type="number" min="0" class="form-control"
                           name="qtd_concentrador"
                           onchange="gerarConcentradores(this.value)">
                </div>

                <div id="concentradores"></div>

                <!-- ================= MEDIDORES ================= -->
                <div class="mb-3 mt-4">
                    <label>Quantidade de Medidores</label>
                    <input type="number" min="0" class="form-control"
                           name="qtd_medidor"
                           onchange="gerarMedidores(this.value)">
                </div>

                <div id="medidores"></div>

                <!-- ================= CONVERSORES ================= -->
                <div class="mb-3 mt-4">
                    <label>Quantidade de Conversores</label>
                    <input type="number" min="0" class="form-control"
                        name="qtd_conversor"
                        onchange="gerarConversores(this.value)">
                </div>

                <div id="conversores"></div>

                <!-- ================= EQUIPAMENTOS DE REDE ================= -->
                <div class="mb-3 mt-4">
                    <label>Quantidade de Equipamentos de Rede</label>
                    <input type="number" min="0" class="form-control"
                        name="qtd_equipamento_rede"
                        onchange="gerarEquipamentosRede(this.value)">
                </div>

                <div id="equipamentos_rede"></div>

                <!-- ================= RADIOS ================= -->
                <div class="mb-3 mt-4">
                    <label>Quantidade de Rádios</label>
                    <input type="number" min="0" class="form-control"
                           name="qtd_radio"
                           onchange="gerarRadios(this.value)">
                </div>

                <div id="radios"></div>

                <!-- ================= GERADORES ================= -->
                <div class="mb-3 mt-4">
                    <label>Quantidade de Geradores</label>
                    <input type="number" min="0" class="form-control"
                           name="qtd_gerador"
                           onchange="gerarGeradores(this.value)">
                </div>

                <div id="geradores"></div>

                <button type="submit" class="btn btn-success w-100 mt-4">
                    Salvar Informações
                </button>

            </form>

        </div>
    </div>

</div>

<script>

// ================= CONCENTRADORES =================

function gerarConcentradores(qtd) {
    let div = document.getElementById("concentradores");
    div.innerHTML = "";

    for (let i = 1; i <= qtd; i++) {
        div.innerHTML += `
        <div class="card mt-3 p-3">
            <h6>Concentrador ${i}</h6>

            <select class="form-control mb-2" name="modelo_${i}">
                <option value="">Modelo</option>
                <option value="Raspberry Pi 5 Model B Rev 1.0">
                    Raspberry Pi 5 Model B Rev 1.0
                </option>
                <option value="Raspberry Pi 4">
                    Raspberry Pi 4
                </option>
            </select>

            <input type="text" class="form-control mb-2"
                   placeholder="Número de Série"
                   name="numero_serie_${i}">

            <input type="text" class="form-control mb-2"
                   placeholder="Tag Name (Ex: EFIZ-PC-01)"
                   name="tag_name_${i}">

            <input type="text" class="form-control mb-2"
                   placeholder="Client Cod (Ex: client16_1)"
                   name="client_cod_${i}">

            <select class="form-control mb-2"
                    name="tipo_eth_${i}"
                    onchange="mostrarETH(this, ${i})">
                <option value="">Tipo Comunicação ETH</option>
                <option value="Via cabo">Via cabo</option>
                <option value="Wi-Fi">Wi-Fi</option>
            </select>

            <div id="extra_eth_${i}"></div>
        </div>
        `;
    }
}

function mostrarETH(select, i) {
    let div = document.getElementById("extra_eth_" + i);
    div.innerHTML = "";

    // ================= VIA CABO =================
    if (select.value === "Via cabo") {
        div.innerHTML = `
            <input class="form-control mb-2"
                   placeholder="MAC (Eth0) (Ex: 88:a2:9e:59:6c:2d)"
                   name="mac_eth_${i}">

            <input class="form-control mb-2"
                   placeholder="IP (Eth0) (Ex: 192.168.0.210)"
                   name="ip_eth_${i}">

            <input class="form-control mb-2"
                   placeholder="Gateway (Eth0) (Ex: 192.168.0.1)"
                   name="gateway_eth_${i}">
        `;
    }

    // ================= WI-FI =================
    if (select.value === "Wi-Fi") {
        div.innerHTML = `
            <input class="form-control mb-2"
                   placeholder="MAC (Wan) (Ex: 88:a2:9e:59:6c:2d)"
                   name="mac_wan_${i}">

            <input class="form-control mb-2"
                   placeholder="IP (Wan) (Ex: 192.168.0.210)"
                   name="ip_wan_${i}">

            <input class="form-control mb-2"
                   placeholder="Gateway (Wan) (Ex: 192.168.0.1)"
                   name="gateway_wan_${i}">
        `;
    }
}

// ================= MEDIDORES =================

function gerarMedidores(qtd) {
    let div = document.getElementById("medidores");
    div.innerHTML = "";

    for (let i = 1; i <= qtd; i++) {
        div.innerHTML += `
        <div class="card mt-3 p-3">
            <h6>Medidor ${i}</h6>

            <input class="form-control mb-2"
                   placeholder="Tag Name (Ex: EFIZ-MD-01)"
                   name="tag_name_medidor_${i}">

            <input class="form-control mb-2"
                   placeholder="Label (máx 12 caracteres)"
                   maxlength="12"
                   name="label_${i}">

            <select class="form-control mb-2"
                    name="qual_medidor_${i}"
                    onchange="mostrarEnergia(this, ${i})">
                <option value="">Qual Medidor</option>
                <option value="Energia">Energia</option>
                <option value="Temperatura">Temperatura</option>
                <option value="Pressão">Pressão</option>
            </select>

            <div id="energia_${i}"></div>
        </div>
        `;
    }
}

function mostrarEnergia(select, i) {
    let div = document.getElementById("energia_" + i);
    div.innerHTML = "";

    if (select.value === "Energia") {
        div.innerHTML = `
            <select class="form-control mb-2"
                    name="tipo_medidor_${i}"
                    onchange="mostrarUP(this, ${i})">
                <option value="">Tipo de Medidor</option>
                <option value="UPENERGY">UPENERGY</option>
                <option value="KRON-Multimedidor">KRON-Multimedidor</option>
                <option value="CCK-Multimedidor">CCK- Multimedidor</option>
                <option value="CCK-ABNT">CCK- ABNT</option>
                <option value="IMS-ABNT">IMS-ABNT</option>
                <option value="ION">ION</option>
            </select>

            <div id="up_${i}"></div>
        `;
    }
}

function mostrarUP(select, i) {
    let div = document.getElementById("up_" + i);
    div.innerHTML = "";

    // ================= UPENERGY =================
    if (select.value === "UPENERGY") {
        div.innerHTML = `
            <input class="form-control mb-2"
                   placeholder="Serial number ID1 (Ex: 012026001)"
                   name="id1_${i}">

            <input class="form-control mb-2"
                   placeholder="Serial name ID2 (Ex: A001A)"
                   name="id2_${i}">

            <input class="form-control mb-2"
                   placeholder="Device Address (Ex: 6017)"
                   name="device_address_${i}">

            <input class="form-control mb-2"
                   placeholder="TC (Ex: 250/5)"
                   name="tc_${i}"
                   onchange="calcularKC(this, ${i})">

            <input class="form-control mb-2"
                   placeholder="Relação KC"
                   name="kc_${i}"
                   id="kc_${i}"
                   readonly>

            <input class="form-control mb-2"
                   placeholder="Relação KT (Ex: 1)"
                   name="kt_${i}">

            <select class="form-control mb-2"
                    name="tensao_${i}">
                <option value="">Tensão F/N</option>
                <option value="127">127</option>
                <option value="220">220</option>
            </select>
        `;
    }

    // ================= KRON =================
    if (select.value === "KRON-Multimedidor") {
        div.innerHTML = `
            <input class="form-control mb-2"
                placeholder="Threshold (Ex: 0.02)"
                name="threshold_${i}">

            <input class="form-control mb-2"
                placeholder="Endereço (Ex: 2)"
                name="device_address_${i}">

            <input class="form-control mb-2"
                placeholder="Serial (Ex: 9.6 8N1)"
                name="serial_${i}">

            <input class="form-control mb-2"
                placeholder="TI (Ex: 15)"
                name="ti_${i}">

            <input class="form-control mb-2"
                placeholder="TL (Ex: 0)"
                name="tl_${i}">

            <input class="form-control mb-2"
                placeholder="TC (Ex: 6.00)"
                name="tc_${i}">

            <input class="form-control mb-2"
                placeholder="TP (Ex: 1.00)"
                name="tp_${i}">

            <select class="form-control mb-2"
                    name="tensao_${i}">
                <option value="">Tensão F/N</option>
                <option value="127">127</option>
                <option value="220">220</option>
            </select>
        `;
    }
}

function calcularKC(input, i) {
    let valor = input.value;

    if (valor.includes("/")) {
        let partes = valor.split("/");
        let num = parseFloat(partes[0]);
        let den = parseFloat(partes[1]);

        if (!isNaN(num) && !isNaN(den) && den !== 0) {
            document.getElementById("kc_" + i).value = num / den;
        }
    }
}

function mostrarConversor(select, i) {
    let div = document.getElementById("extra_med_" + i);
    div.innerHTML = "";

    if (select.value === "Cabeado") {
        div.innerHTML = `
            <input class="form-control mb-2"
                   placeholder="Qual Conversor"
                   name="qual_conversor_${i}">
        `;
    }
}

// ================= CONVERSORES =================

function gerarConversores(qtd) {
    let div = document.getElementById("conversores");
    div.innerHTML = "";

    for (let i = 1; i <= qtd; i++) {
        div.innerHTML += `
        <div class="card mt-3 p-3">
            <h6>Conversor ${i}</h6>

            <input class="form-control mb-2"
                   placeholder="TAG (Ex: EFIZ-CV-02)"
                   name="tag_conversor_${i}">

            <input class="form-control mb-2"
                   placeholder="IP (Ex: 192.168.100.3)"
                   name="ip_conversor_${i}">

            <select class="form-control mb-2"
                    name="tipo_conversor_${i}">
                <option value="">Tipo de Conversor</option>
                <option value="RS485-UTP">RS485-UTP</option>
                <option value="RS485-USB">RS485-USB</option>
            </select>

            <input class="form-control mb-2"
                   placeholder="MAC (Ex: 00:1A:C2:7B:00:48)"
                   name="mac_conversor_${i}">

            <input class="form-control mb-2"
                   placeholder="Baud Rate (Ex: 9600)"
                   name="baudrate_${i}">

            <input class="form-control mb-2"
                   placeholder="Endereço ID (Ex: 1)"
                   name="endereco_id_${i}">

            <input class="form-control mb-2"
                   placeholder="Paridade (Ex: none)"
                   name="paridade_${i}">
        </div>
        `;
    }
}

// ================= EQUIPAMENTO DE REDE =================

function gerarEquipamentosRede(qtd) {
    let div = document.getElementById("equipamentos_rede");
    div.innerHTML = "";

    for (let i = 1; i <= qtd; i++) {
        div.innerHTML += `
        <div class="card mt-3 p-3">
            <h6>Equipamento de Rede ${i}</h6>

            <select class="form-control mb-2"
                    name="tipo_equipamento_${i}">
                <option value="">Qual Equipamento de Rede</option>
                <option value="Nobreak">Nobreak</option>
                <option value="Conversor de Midia">Conversor de Midia</option>
                <option value="Switch">Switch</option>
            </select>

            <input class="form-control mb-2"
                   placeholder="Fabricante (Ex: INTELBRAS)"
                   name="fabricante_equipamento_${i}">

            <input class="form-control mb-2"
                   placeholder="Tag (Ex: EFIZ-NB-01)"
                   name="tag_equipamento_${i}">
        </div>
        `;
    }
}

// ================= RADIOS =================

function gerarRadios(qtd) {
    let div = document.getElementById("radios");
    div.innerHTML = "";

    for (let i = 1; i <= qtd; i++) {
        div.innerHTML += `
        <div class="card mt-3 p-3">
            <h6>Rádio ${i}</h6>

            <input class="form-control mb-2"
                   placeholder="Qual Rádio (Ex: LORA)"
                   name="qual_radio_${i}">

            <input class="form-control mb-2"
                   placeholder="Fabricante (Ex: EBYTE)"
                   name="fabricante_radio_${i}">

            <input class="form-control mb-2"
                   placeholder="Tag (Ex: EFIZ-RF-01)"
                   name="tag_radio_${i}">

            <input class="form-control mb-2"
                   placeholder="ID (Ex: 1)"
                   name="id_radio_${i}">

            <input class="form-control mb-2"
                   placeholder="Addres (Ex: 1)"
                   name="endereco_radio_${i}">

            <input class="form-control mb-2"
                   placeholder="Channel (Ex: 14)"
                   name="canal_radio_${i}">
        </div>
        `;
    }
}

// ================= GERADORES =================

function gerarGeradores(qtd) {
    let div = document.getElementById("geradores");
    div.innerHTML = "";

    for (let i = 1; i <= qtd; i++) {
        div.innerHTML += `
        <div class="card mt-3 p-3">
            <h6>Gerador ${i}</h6>

            <input class="form-control mb-2"
                   placeholder="Fabricante (Ex: Deep Sea)"
                   name="fabricante_gerador_${i}">

            <input class="form-control mb-2"
                   placeholder="Tag Name (Ex: EFIZ-MD-01)"
                   name="tag_gerador_${i}">

            <input class="form-control mb-2"
                   placeholder="Gateway (Ex: 192.168.0.1)"
                   name="gateway_gerador_${i}">

            <input class="form-control mb-2"
                   placeholder="IP (Ex: 192.168.0.211)"
                   name="ip_gerador_${i}">
        </div>
        `;
    }
}

// ================= BLOQUEAR ENTER =================
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelector("form").addEventListener("keydown", function (e) {
            if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
                e.preventDefault();
            }
        });
    });
</script>

</body>

</html>
